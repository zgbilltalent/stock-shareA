<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股数据工具 - {{ version }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --accent-yellow: #eab308;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        
        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .table-container {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 0.75rem;
            text-align: left;
            border-bottom: 1px solid var(--bg-card);
        }
        
        th {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.875rem;
        }
        
        td {
            font-size: 0.875rem;
        }
        
        .positive { color: var(--accent-green); }
        .negative { color: var(--accent-red); }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }
        
        .btn-primary:hover {
            background: #2563eb;
        }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        
        .btn-secondary:hover {
            background: #475569;
        }
        
        .input {
            background: var(--bg-card);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: var(--text-primary);
            width: 100%;
        }
        
        .input:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--bg-card);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .tab-btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: var(--accent-blue);
            color: white;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }
        
        .refresh-btn {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
        }
        
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .badge-green { background: rgba(34, 197, 94, 0.2); color: var(--accent-green); }
        .badge-red { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); }
        .badge-blue { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); }
        
        .toast {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--bg-card);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- Header -->
    <header class="bg-[#1e293b] border-b border-slate-700 px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <h1 class="text-xl font-bold text-white">A股数据工具</h1>
                <span class="text-xs text-slate-400">v{{ version }}</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="clock" class="text-sm text-slate-400"></span>
                <button onclick="refreshAll()" class="btn btn-secondary refresh-btn">刷新全部</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-6 py-6">
        <!-- Stock Query Section -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title">股票查询</h2>
            </div>
            <div class="flex gap-4 flex-wrap">
                <input type="text" id="stockCode" class="input w-48" placeholder="输入股票代码，如 688017">
                <button onclick="queryStock()" class="btn btn-primary">查询</button>
                <button onclick="queryValuation()" class="btn btn-secondary">完整估值</button>
                <button onclick="queryResearch()" class="btn btn-secondary">个股研报</button>
                <button onclick="queryDisclosure()" class="btn btn-secondary">公司公告</button>
                <button onclick="queryFundamental()" class="btn btn-secondary">基础数据</button>
            </div>
            <div id="stockResult" class="mt-4"></div>
        </div>

        <!-- Tabs -->
        <div class="flex gap-2 mb-4 flex-wrap">
            <button class="tab-btn active" data-tab="signals">市场信号</button>
            <button class="tab-btn" data-tab="hot">强势股</button>
            <button class="tab-btn" data-tab="topics">题材热度</button>
            <button class="tab-btn" data-tab="industry">行业对比</button>
            <button class="tab-btn" data-tab="northbound">北向资金</button>
            <button class="tab-btn" data-tab="lhb">龙虎榜</button>
            <button class="tab-btn" data-tab="news">市场快讯</button>
        </div>

        <!-- Tab Contents -->
        <div id="tab-signals" class="tab-content">
            <!-- Quick Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                <div class="stat-card">
                    <div class="stat-value" id="stat-hot-count">-</div>
                    <div class="stat-label">强势股数量</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-topics-count">-</div>
                    <div class="stat-label">热门题材数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-northbound">-</div>
                    <div class="stat-label">北向今日(亿)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-lhb-count">-</div>
                    <div class="stat-label">龙虎榜记录</div>
                </div>
            </div>

            <!-- Quick Links -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                <button onclick="switchTab('hot')" class="btn btn-secondary">强势股 TOP10</button>
                <button onclick="switchTab('topics')" class="btn btn-secondary">题材热度</button>
                <button onclick="switchTab('industry')" class="btn btn-secondary">行业对比</button>
                <button onclick="switchTab('northbound')" class="btn btn-secondary">北向资金</button>
                <button onclick="switchTab('lhb')" class="btn btn-secondary">龙虎榜</button>
                <button onclick="switchTab('news')" class="btn btn-secondary">市场快讯</button>
            </div>
        </div>

        <!-- Hot Stocks -->
        <div id="tab-hot" class="tab-content hidden">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">当日强势股 TOP10</h2>
                    <button onclick="loadHotStocks()" class="btn btn-secondary refresh-btn">刷新</button>
                </div>
                <div id="hotTable" class="table-container"></div>
            </div>
        </div>

        <!-- Topics -->
        <div id="tab-topics" class="tab-content hidden">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">热门题材</h2>
                    <button onclick="loadTopics()" class="btn btn-secondary refresh-btn">刷新</button>
                </div>
                <div id="topicsTable" class="table-container"></div>
            </div>
        </div>

        <!-- Industry -->
        <div id="tab-industry" class="tab-content hidden">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">行业涨跌幅</h2>
                    <button onclick="loadIndustry()" class="btn btn-secondary refresh-btn">刷新</button>
                </div>
                <div id="industryTable" class="table-container"></div>
            </div>
        </div>

        <!-- Northbound -->
        <div id="tab-northbound" class="tab-content hidden">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">北向资金</h2>
                    <button onclick="loadNorthbound()" class="btn btn-secondary refresh-btn">刷新</button>
                </div>
                <div id="northboundContent"></div>
            </div>
        </div>

        <!-- Dragon Tiger -->
        <div id="tab-lhb" class="tab-content hidden">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">龙虎榜</h2>
                    <button onclick="loadDragonTiger()" class="btn btn-secondary refresh-btn">刷新</button>
                </div>
                <div id="lhbTable" class="table-container"></div>
            </div>
        </div>

        <!-- News -->
        <div id="tab-news" class="tab-content hidden">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">市场快讯</h2>
                    <button onclick="loadNews()" class="btn btn-secondary refresh-btn">刷新</button>
                </div>
                <div id="newsTable" class="table-container"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-slate-500 text-sm">
        <p>A股全栈数据工具包 | 数据来源：腾讯财经、同花顺、东方财富、akshare</p>
    </footer>

    <script>
        // API Base URL
        const API_BASE = '/api';

        // Update clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleString('zh-CN');
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Toast notification
        function showToast(message, success = true) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.borderLeft = `4px solid ${success ? '#22c55e' : '#ef4444'}`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // API request helper
        async function apiRequest(url) {
            try {
                const res = await fetch(url);
                const json = await res.json();
                if (!json.success && json.message) {
                    showToast(json.message, false);
                }
                return json;
            } catch (e) {
                showToast('网络请求失败: ' + e.message, false);
                return { success: false, data: null };
            }
        }

        // Loading state
        function showLoading(el) {
            el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
        }

        // Format number with color
        function formatChange(val) {
            if (val === null || val === undefined) return '-';
            const num = parseFloat(val);
            const cls = num > 0 ? 'positive' : num < 0 ? 'negative' : '';
            const sign = num > 0 ? '+' : '';
            return `<span class="${cls}">${sign}${num.toFixed(2)}%</span>`;
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchTab(btn.dataset.tab);
            });
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            
            // Load data if not loaded
            if (!window[`${tabName}Loaded`]) {
                window[`${tabName}Loaded`] = true;
                switch(tabName) {
                    case 'hot': loadHotStocks(); break;
                    case 'topics': loadTopics(); break;
                    case 'industry': loadIndustry(); break;
                    case 'northbound': loadNorthbound(); break;
                    case 'lhb': loadDragonTiger(); break;
                    case 'news': loadNews(); break;
                    case 'signals': loadQuickStats(); break;
                }
            }
        }

        // ==================== Stock Query ====================
        async function queryStock() {
            const code = document.getElementById('stockCode').value.trim();
            if (!code) {
                showToast('请输入股票代码', false);
                return;
            }
            const el = document.getElementById('stockResult');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/quote/${code}`);
            if (res.success && res.data) {
                const d = res.data;
                el.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="stat-card">
                            <div class="stat-label">当前价</div>
                            <div class="stat-value">${d.price || '-'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">涨跌幅</div>
                            <div class="stat-value">${formatChange(d.change_pct)}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">成交量</div>
                            <div class="stat-value">${d.volume ? (d.volume/10000).toFixed(0) + '万' : '-'}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">成交额</div>
                            <div class="stat-value">${d.amount ? (d.amount/100000000).toFixed(2) + '亿' : '-'}</div>
                        </div>
                    </div>
                `;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无数据</p>';
            }
        }

        async function queryValuation() {
            const code = document.getElementById('stockCode').value.trim();
            if (!code) {
                showToast('请输入股票代码', false);
                return;
            }
            const el = document.getElementById('stockResult');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/valuation/${code}`);
            if (res.success && res.data) {
                const d = res.data;
                let html = '<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">';
                if (d.forward_pe) html += `<div class="stat-card"><div class="stat-label">前向PE</div><div class="stat-value">${d.forward_pe.toFixed(2)}</div></div>`;
                if (d.peg) html += `<div class="stat-card"><div class="stat-label">PEG</div><div class="stat-value">${d.peg.toFixed(2)}</div></div>`;
                if (d.pe_digest_years) html += `<div class="stat-card"><div class="stat-label">PE消化年限</div><div class="stat-value">${d.pe_digest_years.toFixed(1)}年</div></div>`;
                if (d.market_cap_yi) html += `<div class="stat-card"><div class="stat-label">市值(亿)</div><div class="stat-value">${d.market_cap_yi.toFixed(0)}</div></div>`;
                html += '</div>';
                
                if (d.summary) {
                    html += `<div class="bg-slate-800 rounded-lg p-4"><pre class="text-sm text-slate-300 whitespace-pre-wrap">${d.summary}</pre></div>`;
                }
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无估值数据</p>';
            }
        }

        async function queryResearch() {
            const code = document.getElementById('stockCode').value.trim();
            if (!code) {
                showToast('请输入股票代码', false);
                return;
            }
            const el = document.getElementById('stockResult');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/research/stock/${code}`);
            if (res.success && res.data && res.data.length > 0) {
                let html = '<table><thead><tr><th>标题</th><th>机构</th><th>评级</th><th>日期</th></tr></thead><tbody>';
                res.data.slice(0, 10).forEach(r => {
                    html += `<tr>
                        <td>${r.title || r.研报标题 || '-'}</td>
                        <td>${r.org || r.机构 || '-'}</td>
                        <td>${r.rating || r.评级 || '-'}</td>
                        <td>${r.date || r.日期 || '-'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无研报数据</p>';
            }
        }

        async function queryDisclosure() {
            const code = document.getElementById('stockCode').value.trim();
            if (!code) {
                showToast('请输入股票代码', false);
                return;
            }
            const el = document.getElementById('stockResult');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/disclosure/${code}`);
            if (res.success && res.data && res.data.length > 0) {
                let html = '<table><thead><tr><th>公告标题</th><th>时间</th></tr></thead><tbody>';
                res.data.slice(0, 10).forEach(r => {
                    html += `<tr>
                        <td><a href="${r.pdf链接 || '#'}" target="_blank" class="text-blue-400 hover:underline">${r.公告标题 || '-'}</a></td>
                        <td>${r.公告时间 || '-'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无公告数据</p>';
            }
        }

        async function queryFundamental() {
            const code = document.getElementById('stockCode').value.trim();
            if (!code) {
                showToast('请输入股票代码', false);
                return;
            }
            const el = document.getElementById('stockResult');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/fundamental/${code}`);
            if (res.success && res.data) {
                const d = res.data;
                let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
                
                if (d.basic) {
                    html += `<div class="stat-card"><div class="stat-label">股票信息</div><pre class="text-sm text-left mt-2">${JSON.stringify(d.basic, null, 2)}</pre></div>`;
                }
                if (d.main_index) {
                    html += `<div class="stat-card"><div class="stat-label">主要指标</div><pre class="text-sm text-left mt-2">${JSON.stringify(d.main_index, null, 2)}</pre></div>`;
                }
                html += '</div>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无基础数据</p>';
            }
        }

        // ==================== Market Signals ====================
        async function loadQuickStats() {
            const [hot, topics, nb, lhb] = await Promise.all([
                apiRequest(`${API_BASE}/signals/hot?limit=1`),
                apiRequest(`${API_BASE}/signals/topics?limit=1`),
                apiRequest(`${API_BASE}/signals/northbound`),
                apiRequest(`${API_BASE}/signals/dragon_tiger`)
            ]);
            
            document.getElementById('stat-hot-count').textContent = hot.data ? hot.data.length : hot.message || '-';
            document.getElementById('stat-topics-count').textContent = topics.data ? topics.data.length : '-';
            
            if (nb.data) {
                const total = nb.data.total || 0;
                document.getElementById('stat-northbound').innerHTML = formatChange(total);
                document.getElementById('stat-northbound').className = `stat-value ${total > 0 ? 'positive' : total < 0 ? 'negative' : ''}`;
            }
            
            document.getElementById('stat-lhb-count').textContent = lhb.data ? lhb.data.total_records || 0 : '-';
        }

        async function loadHotStocks() {
            const el = document.getElementById('hotTable');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/signals/hot?limit=20`);
            if (res.data && res.data.length > 0) {
                let html = '<table><thead><tr><th>代码</th><th>名称</th><th>涨幅</th><th>题材归因</th></tr></thead><tbody>';
                res.data.forEach(s => {
                    html += `<tr>
                        <td>${s.代码 || s.code || '-'}</td>
                        <td>${s.名称 || s.name || '-'}</td>
                        <td>${formatChange(s.涨幅 || s.change)}</td>
                        <td>${s.题材归因 || s.reason || '-'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无数据</p>';
            }
        }

        async function loadTopics() {
            const el = document.getElementById('topicsTable');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/signals/topics?limit=30`);
            if (res.data && res.data.length > 0) {
                let html = '<table><thead><tr><th>排名</th><th>题材</th><th>相关股票数</th></tr></thead><tbody>';
                res.data.forEach((t, i) => {
                    html += `<tr>
                        <td>${i + 1}</td>
                        <td><span class="badge badge-blue">${t.topic || t.tag}</span></td>
                        <td>${t.count || '-'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无数据</p>';
            }
        }

        async function loadIndustry() {
            const el = document.getElementById('industryTable');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/signals/industry?limit=50`);
            if (res.data && (res.data.top || res.data.bottom)) {
                let html = '<table><thead><tr><th>排名</th><th>行业</th><th>涨跌幅</th><th>领涨股</th></tr></thead><tbody>';
                
                // Combine and sort
                const all = [...(res.data.top || []), ...(res.data.bottom || [])]
                    .sort((a, b) => (b.change_pct || 0) - (a.change_pct || 0));
                
                all.forEach((ind, i) => {
                    const pct = ind.change_pct || 0;
                    html += `<tr>
                        <td>${i + 1}</td>
                        <td>${ind.name || '-'}</td>
                        <td>${formatChange(pct)}</td>
                        <td>${ind.leader || '-'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无数据</p>';
            }
        }

        async function loadNorthbound() {
            const el = document.getElementById('northboundContent');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/signals/northbound`);
            if (res.data) {
                const d = res.data;
                const total = d.total || 0;
                const signal = d.signal_cn || '未知';
                const signalClass = d.signal === 'bullish' ? 'badge-green' : d.signal === 'bearish' ? 'badge-red' : 'badge-blue';
                
                el.innerHTML = `
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                        <div class="stat-card">
                            <div class="stat-label">沪股通今日</div>
                            <div class="stat-value ${d.hgt_today > 0 ? 'positive' : d.hgt_today < 0 ? 'negative' : ''}">${(d.hgt_today || 0).toFixed(2)}亿</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">深股通今日</div>
                            <div class="stat-value ${d.sgt_today > 0 ? 'positive' : d.sgt_today < 0 ? 'negative' : ''}">${(d.sgt_today || 0).toFixed(2)}亿</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">合计</div>
                            <div class="stat-value ${total > 0 ? 'positive' : total < 0 ? 'negative' : ''}">${total.toFixed(2)}亿</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">信号</div>
                            <div class="stat-value"><span class="badge ${signalClass}">${signal}</span></div>
                        </div>
                    </div>
                `;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无数据</p>';
            }
        }

        async function loadDragonTiger() {
            const el = document.getElementById('lhbTable');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/signals/dragon_tiger?limit=20`);
            if (res.data && res.data.stocks && res.data.stocks.length > 0) {
                let html = `<p class="text-sm text-slate-400 mb-4">${res.data.date || ''} 共 ${res.data.total_records} 条记录</p>`;
                html += '<table><thead><tr><th>代码</th><th>名称</th><th>原因</th><th>净买(万)</th><th>涨跌幅</th></tr></thead><tbody>';
                res.data.stocks.forEach(s => {
                    html += `<tr>
                        <td>${s.code || '-'}</td>
                        <td>${s.name || '-'}</td>
                        <td class="max-w-xs truncate">${s.reason || '-'}</td>
                        <td class="${(s.net_buy_wan || 0) > 0 ? 'positive' : 'negative'}">${(s.net_buy_wan || 0).toFixed(0)}</td>
                        <td>${formatChange(s.change_pct)}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无数据（非交易日或盘后未更新）</p>';
            }
        }

        async function loadNews() {
            const el = document.getElementById('newsTable');
            showLoading(el);
            const res = await apiRequest(`${API_BASE}/news/market?limit=30`);
            if (res.data && res.data.length > 0) {
                let html = '<table><thead><tr><th>时间</th><th>标题</th><th>来源</th></tr></thead><tbody>';
                res.data.forEach(n => {
                    html += `<tr>
                        <td class="whitespace-nowrap">${n.发布时间 || '-'}</td>
                        <td>${n.新闻标题 || n.title || '-'}</td>
                        <td>${n.文章来源 || n.source || '-'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<p class="text-slate-400">暂无数据</p>';
            }
        }

        // Refresh all
        async function refreshAll() {
            window.hotLoaded = false;
            window.topicsLoaded = false;
            window.industryLoaded = false;
            window.northboundLoaded = false;
            window.lhbLoaded = false;
            window.newsLoaded = false;
            window.signalsLoaded = false;
            
            switchTab('signals');
            showToast('正在刷新...');
        }

        // Enter key for stock query
        document.getElementById('stockCode').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') queryStock();
        });

        // Initial load
        switchTab('signals');
    </script>
</body>
</html>
